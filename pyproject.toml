[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formist-cli"
version = "0.1.0"
description = "Command-line client for Formist and Evane deployments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "WeCarbon" }]
keywords = ["formist", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://formist.ai"
Repository = "https://github.com/WeCarbon/formist-cli"

[project.scripts]
fm = "formist_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/formist_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"
